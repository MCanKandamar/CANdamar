name: Windows exe

# Builds dist/CANdamar.exe (one file, WebView2 window) and the candamar wheel
# on every push and uploads them as a downloadable artifact. On a version tag
# (v*) it also publishes the GitHub release: the notes come from the matching
# "## vX.Y.Z" section of docs/CHANGELOG.md, and the tag must match the
# version in backend/pyproject.toml.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going;
# tag (release) runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    name: Build CANdamar.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(tr -d '\r' < backend/pyproject.toml | sed -n 's/^version *= *"\(.*\)"/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match backend/pyproject.toml version $version"
            exit 1
          fi

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # Lines after "## <tag> ..." up to the next "## " heading, without the --- rulers
          # (the Windows checkout has CRLF line endings, so strip the CR first)
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found && !/^---$/ { print }
          ' docs/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::docs/CHANGELOG.md has no '## $GITHUB_REF_NAME' section"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build exe
        shell: pwsh
        run: ./packaging/windows/build_exe.ps1

      - name: Smoke test (server only, no window)
        shell: pwsh
        run: |
          $env:CANDAMAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'candamar-data'
          $proc = Start-Process -FilePath dist\CANdamar.exe -ArgumentList '--no-window', '--port', '47811' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { Invoke-RestMethod http://127.0.0.1:47811/status -TimeoutSec 2 | Out-Null; $ok = $true; break }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) {
              Get-Content (Join-Path $env:CANDAMAR_DATA_DIR 'candamar.log') -ErrorAction SilentlyContinue
              throw 'CANdamar.exe did not start'
            }
            $page = Invoke-WebRequest http://127.0.0.1:47811/ -UseBasicParsing
            if ($page.Content -notmatch 'id="root"') { throw 'Frontend is not served from the exe' }
            Write-Host 'CANdamar.exe serves the API and the frontend'
          } finally {
            Get-Process CANdamar -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # The exe build has already written the frontend into backend/canviz/static,
      # so the wheel carries the UI and installs without Node.js.
      - name: Build wheel
        shell: bash
        run: |
          python -m pip wheel ./backend --no-deps -w dist
          python -m zipfile -l dist/candamar-*.whl | grep -q 'canviz/static/index.html' \
            || { echo "::error::The wheel does not contain the frontend"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: CANdamar-windows
          path: |
            dist/CANdamar.exe
            dist/candamar-*.whl
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/CANdamar.exe
            dist/candamar-*.whl
