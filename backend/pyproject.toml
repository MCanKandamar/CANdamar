[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candamar"
version = "0.5.0"
description = "CAN bus analyzer for slcan adapters and CANopen drives (fork of CANviz)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Muslum Can Kandamar" },
    { name = "Chanchal Dhiman", email = "chanchalv.dhiman@gmail.com" },  # original CANviz author
]
keywords = ["CAN bus", "automotive", "analyzer", "cantools", "python-can", "J1939", "CANopen", "slcan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha"
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-can[gs_usb]>=4.3",
    "pyusb>=1.2",
    "libusb>=1.0.26",
    "cantools>=39",
    "aiofiles>=23",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pyserial>=3.0",
    # J1939 PGN/SPN database - Apache 2.0, CSS Electronics (~100 KB)
    # Provides ~1000+ PGN definitions. Falls back to built-in 52-PGN table if unavailable.
    "pretty_j1939>=0.0.4",
    "httpx>=0.27",
    "canopen>=2.4.0",
]

[project.urls]
Homepage   = "https://github.com/MCanKandamar/CANdamar"
Repository = "https://github.com/MCanKandamar/CANdamar"
Issues     = "https://github.com/MCanKandamar/CANdamar/issues"
Changelog  = "https://github.com/MCanKandamar/CANdamar/releases"
Upstream   = "https://github.com/Chanchaldhiman/CANviz"

[project.scripts]
candamar = "canviz.cli:main"
# Same command under the original name, so CANviz docs and scripts keep working
canviz = "canviz.cli:main"

[project.gui-scripts]
# Native window (pywebview) instead of a browser tab; needs the "desktop" extra
candamar-desktop = "canviz.desktop:main"

[project.optional-dependencies]
# ISO-TP stack for OBD-II and UDS (Phase 5.3 / 5.4)
uds = [
    "can-isotp>=2.0",
    "udsoncan>=1.21",
]
# Reverse-engineering toolkit - numpy/scipy (Phase 5.6)
re = [
    "numpy>=1.26",
    "scipy>=1.13",
]
# Desktop window (canviz-desktop / Windows exe) - Edge WebView2 on Windows
desktop = [
    "pywebview>=5.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.package-data]
canviz = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the classic default rule set; newer ruff releases enable many more
# rules by default, which would fail CI (ruff>=0.4 is not pinned).
select = ["E4", "E7", "E9", "F"]